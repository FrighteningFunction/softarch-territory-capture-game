name: PR build and tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show selected .NET SDK
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore TerritoryCapture.sln --locked-mode

      - name: Check locked restore against newer Blazor pack defaults
        run: |
          dotnet restore TerritoryCapture.sln --locked-mode --force -p:CustomAfterMicrosoftCommonTargets="$GITHUB_WORKSPACE/tests/build/newer-wasm-defaults.targets"
          dotnet restore tests/TerritoryCapture.BrowserHarness --locked-mode --force -p:CustomAfterMicrosoftCommonTargets="$GITHUB_WORKSPACE/tests/build/newer-wasm-defaults.targets"

      - name: Build
        run: dotnet build TerritoryCapture.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TerritoryCapture.sln --configuration Release --no-build --no-restore
